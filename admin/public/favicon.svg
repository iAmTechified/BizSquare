<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="round">
      <rect width="100" height="100" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" rx="18" ry="18" fill="#06080d"/>

  <!-- ─── BLUE main diagonal bar (top-left → bottom-right) ─── -->
  <polygon points="12,12 42,12 88,58 88,88 58,88 12,42" fill="#0058FF" clip-path="url(#round)"/>
  <!-- inner cutout to create the channel -->
  <polygon points="12,12 32,12 78,58 88,58 88,70 68,70 22,24 12,24" fill="#06080d" clip-path="url(#round)"/>
  <polygon points="42,76 88,76 88,88 54,88" fill="#06080d" clip-path="url(#round)"/>

  <!-- ─── GREEN top-right triangle ─── -->
  <polygon points="58,12 88,12 88,42" fill="#5AFF00" clip-path="url(#round)"/>

  <!-- ─── PINK bottom-left triangle ─── -->
  <polygon points="12,58 42,88 12,88" fill="#FF00A6" clip-path="url(#round)"/>

  <!-- ─── Corner dots ─── -->
  <!-- Top-left blue dot -->
  <rect x="13" y="13" width="13" height="13" rx="3" fill="#0058FF"/>
  <rect x="16" y="16" width="7" height="7" rx="1.5" fill="#06080d"/>

  <!-- Top-right green dot -->
  <rect x="74" y="13" width="13" height="13" rx="3" fill="#5AFF00"/>
  <rect x="77" y="16" width="7" height="7" rx="1.5" fill="#06080d"/>

  <!-- Bottom-left pink dot -->
  <rect x="13" y="74" width="13" height="13" rx="3" fill="#FF00A6"/>
  <rect x="16" y="77" width="7" height="7" rx="1.5" fill="#06080d"/>

  <!-- Bottom-right blue dot -->
  <rect x="74" y="74" width="13" height="13" rx="3" fill="#0058FF"/>
  <rect x="77" y="77" width="7" height="7" rx="1.5" fill="#06080d"/>
</svg>