name: bizsquare
description: "BizSquare - WhatsApp-first Business Growth Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_contacts: ^2.1.0
  permission_handler: ^12.0.3
  share_plus: ^13.3.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  flutter_card_swiper: ^7.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.0
  lucide_icons: ^0.257.0
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  hugeicons: ^1.1.7
  url_launcher: ^6.3.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.2.1
  home_widget: ^0.7.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/avatars/
    - shorebird.yaml
